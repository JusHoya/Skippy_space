# Langfuse self-hosted OTLP backend — Phase 1 target (PRD §9.3).
#
# Phase 0 does NOT require Langfuse to be running; the renderer reads OTel
# spans directly off the Tauri Channel until the persistence layer comes
# online. Bring this up only when you start exercising the OTLP exporter in
# `packages/otel`.
#
# Bring up:  docker compose --profile langfuse -f infra/langfuse/docker-compose.yml up -d
# Tear down: docker compose -f infra/langfuse/docker-compose.yml down
#
# Web UI:     http://localhost:3000
# OTLP HTTP:  http://localhost:3000/api/public/otel  (the collector posts here)
#
# Why v3 (not v2):
#   Langfuse's OTLP ingest endpoint (`/api/public/otel`) was introduced in
#   Langfuse v3 (v3.22.0+). Our whole telemetry leg — agent-runtime → OTel
#   collector → Langfuse over OTLP (PRD §9.3, "OTLP-native at /api/public/otel")
#   — DEPENDS on that endpoint. The previous pin to `langfuse:2` had no OTLP
#   endpoint at all, so a span could never land; the config was self-
#   contradictory. v3 needs a ClickHouse + Redis + S3-compatible blob store
#   alongside Postgres, so they are all defined below. This is heavier than a
#   v2 box, but it is the minimum that actually makes the exporter work.
#
# Security posture (local dev):
#   - Every published port binds to 127.0.0.1 ONLY. Nothing here is reachable
#     off-host out of the box. (Docker's `127.0.0.1:` host-IP prefix; do NOT
#     drop it — a bare `3000:3000` binds 0.0.0.0 and opens the service.)
#   - There are NO hardcoded credentials. Every secret is a REQUIRED env var
#     using the `${VAR:?message}` form, so `docker compose up` FAILS LOUDLY if
#     `.env` is missing/incomplete instead of silently booting with a known
#     default password. See .env.example for the full list + how to generate
#     each value.

services:
  langfuse-db:
    # Pinned to 16.4 for reproducibility — bump deliberately, not implicitly.
    image: postgres:16.4-alpine
    restart: unless-stopped
    profiles: ['langfuse']
    environment:
      POSTGRES_USER: ${LANGFUSE_POSTGRES_USER:?set LANGFUSE_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:?set LANGFUSE_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${LANGFUSE_POSTGRES_DB:-langfuse}
    # Bind to loopback only — never expose Postgres off-host.
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - langfuse-pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - 'CMD-SHELL'
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 10s
      timeout: 5s
      retries: 10

  langfuse-clickhouse:
    # ClickHouse is the v3 analytical store for traces/observations.
    image: clickhouse/clickhouse-server:24.3
    restart: unless-stopped
    profiles: ['langfuse']
    environment:
      CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?set LANGFUSE_CLICKHOUSE_PASSWORD in .env}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    # Loopback-only HTTP (8123) + native (9000) ports.
    ports:
      - '127.0.0.1:8123:8123'
      - '127.0.0.1:9000:9000'
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test:
        - 'CMD-SHELL'
        - 'wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  langfuse-redis:
    # Redis backs the v3 ingestion queue. Password-protected; loopback-only.
    image: redis:7
    restart: unless-stopped
    profiles: ['langfuse']
    command:
      - '--requirepass'
      - '${LANGFUSE_REDIS_PASSWORD:?set LANGFUSE_REDIS_PASSWORD in .env}'
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDISCLI_AUTH" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      # redis-cli reads REDISCLI_AUTH so the password never appears in `ps`.
      REDISCLI_AUTH: ${LANGFUSE_REDIS_PASSWORD:?set LANGFUSE_REDIS_PASSWORD in .env}

  langfuse-minio:
    # MinIO is the S3-compatible blob store v3 uses for event/media uploads.
    image: minio/minio
    restart: unless-stopped
    profiles: ['langfuse']
    command: server /data --console-address ":9091"
    environment:
      MINIO_ROOT_USER: ${LANGFUSE_S3_ACCESS_KEY_ID:?set LANGFUSE_S3_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${LANGFUSE_S3_SECRET_ACCESS_KEY:?set LANGFUSE_S3_SECRET_ACCESS_KEY in .env}
    # S3 API on 9000-internal is busy in clickhouse's native port namespace on
    # the host; publish MinIO's API on 9002 and console on 9091, loopback-only.
    ports:
      - '127.0.0.1:9002:9000'
      - '127.0.0.1:9091:9091'
    volumes:
      - langfuse-minio-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'mc ready local || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  langfuse-worker:
    # The v3 worker drains the Redis ingestion queue into ClickHouse. Without
    # it, spans are accepted at the OTLP endpoint but never become queryable.
    image: langfuse/langfuse-worker:3
    restart: unless-stopped
    profiles: ['langfuse']
    depends_on:
      langfuse-db:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
    environment: &langfuse-common-env
      DATABASE_URL: postgresql://${LANGFUSE_POSTGRES_USER:?set LANGFUSE_POSTGRES_USER in .env}:${LANGFUSE_POSTGRES_PASSWORD:?set LANGFUSE_POSTGRES_PASSWORD in .env}@langfuse-db:5432/${LANGFUSE_POSTGRES_DB:-langfuse}
      SALT: ${LANGFUSE_SALT:?set LANGFUSE_SALT in .env (32+ random chars)}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?set LANGFUSE_ENCRYPTION_KEY in .env (64 hex chars)}
      TELEMETRY_ENABLED: 'false'
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?set LANGFUSE_CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_CLUSTER_ENABLED: 'false'
      REDIS_HOST: langfuse-redis
      REDIS_PORT: '6379'
      REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD:?set LANGFUSE_REDIS_PASSWORD in .env}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${LANGFUSE_S3_BUCKET:-langfuse}
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_ACCESS_KEY_ID:?set LANGFUSE_S3_ACCESS_KEY_ID in .env}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_SECRET_ACCESS_KEY:?set LANGFUSE_S3_SECRET_ACCESS_KEY in .env}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: 'true'
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: 'events/'
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: ${LANGFUSE_S3_BUCKET:-langfuse}
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_ACCESS_KEY_ID:?set LANGFUSE_S3_ACCESS_KEY_ID in .env}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_SECRET_ACCESS_KEY:?set LANGFUSE_S3_SECRET_ACCESS_KEY in .env}
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: 'true'
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: 'media/'

  langfuse-server:
    # Langfuse web/API + OTLP ingest. See header for the v2→v3 rationale.
    image: langfuse/langfuse:3
    restart: unless-stopped
    profiles: ['langfuse']
    depends_on:
      langfuse-db:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
    # Web UI + OTLP ingest, loopback-only. The collector reaches this over the
    # shared docker network by service name (langfuse-server:3000), not via
    # this published port — the publish is just for the human-facing UI.
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      <<: *langfuse-common-env
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?set LANGFUSE_NEXTAUTH_SECRET in .env (32+ random chars)}
      # Provision a deterministic org/project + API key pair at first boot so
      # the OTel collector's Basic-auth header (LANGFUSE_OTEL_AUTH_BASIC in
      # .env) matches a real project. These must agree — see .env.example.
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-skippy}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-Skippy_space}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-skippy-space}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-Skippy_space}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?set LANGFUSE_PUBLIC_KEY in .env}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?set LANGFUSE_SECRET_KEY in .env}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:?set LANGFUSE_INIT_USER_EMAIL in .env}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-Skippy}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:?set LANGFUSE_INIT_USER_PASSWORD in .env (8+ chars)}

volumes:
  langfuse-pgdata:
  langfuse-clickhouse-data:
  langfuse-clickhouse-logs:
  langfuse-minio-data:
