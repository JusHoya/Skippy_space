# OpenTelemetry Collector (contrib) configuration — Phase 1.
#
# The Rust shell's bundled OTel collector forwards to this network collector
# in dev; in v1 we will move the collector into the Rust shell process (per
# PRD §9.2). For Phase 1 we run it as a sidecar Docker container so we can
# iterate without rebuilding the Tauri shell every time.
#
# Pipeline:
#   agent-runtime (Node) ──OTLP/HTTP :4319──► this collector
#                          ──OTLP/gRPC :4317──► this collector
#                                                  │
#                                                  ├──► Langfuse OTLP at
#                                                  │     http://langfuse-server:3000
#                                                  │     /api/public/otel  (+ /v1/traces)
#                                                  │
#                                                  └──► stdout (debug)
#
# Why HTTP on :4319 and not the canonical :4318:
#   We keep this collector's HTTP receiver off the canonical :4318 so it can
#   coexist with any other local OTLP listener on the host without a port
#   clash. The agent-runtime's OTEL_EXPORTER_OTLP_ENDPOINT env var must point
#   here (see .env.example), not directly at Langfuse, so we can fan out to
#   multiple exporters. NOTE: Langfuse v3's OTLP ingest is on :3000 at the
#   path below — it does NOT listen on :4318 (an earlier comment claimed it
#   did; that was wrong and is corrected here).

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4319

processors:
  # Bound memory consumption — refuse new spans before the container OOMs.
  # 512 MiB ballast is plenty for hobby-scale Skippy traffic; tune up when
  # the board agents start chattering.
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  # Standard batching for throughput. Defaults are reasonable; explicit
  # for clarity.
  batch:
    timeout: 5s
    send_batch_size: 512
    send_batch_max_size: 1024

exporters:
  # Primary persistence: Langfuse's OTLP ingest path. The hostname
  # `langfuse-server` resolves via the shared docker network — see
  # infra/otel-collector/docker-compose.yml.
  #
  # Langfuse's OTLP endpoint (introduced in Langfuse v3) lives at
  # `/api/public/otel`; the otlphttp exporter appends the signal suffix, so
  # traces are POSTed to `/api/public/otel/v1/traces`. It REQUIRES HTTP Basic
  # auth built from a project's API keys:
  #     Authorization: Basic base64("<public_key>:<secret_key>")
  # We read the pre-computed base64 blob from the environment so no secret is
  # baked into this file. The container gets LANGFUSE_OTEL_AUTH_BASIC from the
  # compose env (which sources `.env`); see .env.example for how to compute it.
  # Without this header every span is rejected with 401 and nothing lands.
  otlphttp/langfuse:
    endpoint: http://langfuse-server:3000/api/public/otel
    headers:
      Authorization: 'Basic ${env:LANGFUSE_OTEL_AUTH_BASIC}'
    # In-cluster plain HTTP to a sibling container on the shared docker
    # network — no TLS to verify. (External/HTTPS deployments would drop this
    # and use a real cert.)
    tls:
      insecure: true

  # Always-on debug fan-out so `docker compose logs` shows every span.
  # `logging` is deprecated in newer collector builds in favor of `debug`;
  # the contrib image at the version we pin still accepts `logging`.
  logging:
    loglevel: info

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/langfuse, logging]
